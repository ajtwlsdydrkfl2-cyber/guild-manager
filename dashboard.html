<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대시보드 — 길드 매니저</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style id="commonStyle"></style>
<style>
.dash-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:1024px){.dash-grid{grid-template-columns:1fr 1fr;}}
.notice-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);border-radius:var(--radius);padding:12px 16px;color:#f87171;font-size:13px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;}
.stat-lbl{font-size:11px;color:var(--text2);margin-bottom:4px;}
.stat-val{font-size:18px;font-weight:700;color:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="sb-ov" id="sbOv" onclick="closeSb()"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="ham" onclick="toggleSb()">☰</button>
        <div class="topbar-title">대시보드</div>
      </div>
    </div>
    
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('guild',this)">🏠 길드원 현황</div>
      <div class="tab" onclick="switchTab('boss',this)">⚔️ 보스 포인트</div>
      <div class="tab" onclick="switchTab('week',this)">📊 주간 기록</div>
    </div>
    
    <div class="content">
      <div class="notice-box">
        <span>⚠️</span> 보스 회차 추가 후 <strong style="color:#ef4444; text-decoration: underline;">1시간 뒤 자동 잠금</strong> · 참여 변경 내역은 로그에 기록됩니다
      </div>
      
      <div id="dashContent"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
// 공통 디자인 양식 주입
document.getElementById('commonStyle').textContent = COMMON_CSS;

let sess, members=[], bosses=[], attend={};
let curTab = 'guild';
let isInitialDataLoaded = false; // 💡 파이어베이스 첫 수신 여부 확인 플래그

window.addEventListener('load', () => {
  try {
    sess = requireLogin(); 
    if(!sess) return;
    
    initFirebase();
    watchServerName();
    
    // 로컬 스토리지 임시 데이터 확보
    members = getData('members', []);
    bosses = getData('bosses', DEFAULT_BOSSES);
    attend = getData('attend', {});
    
    // 💡 최초 화면 로드 시 데이터 유무 판정 후 안전 가드 렌더링
    initialLoadSequence();
  } catch(e) {
    console.error("초기화 예외 방어:", e);
    renderCurrentDashboard();
  }

  // ==========================================
  // ⚡ 파이어베이스 실시간 동기화 및 정렬 패치
  // ==========================================
  fbListen('members', d => {
    if(d) {
      members = Array.isArray(d) ? d : Object.values(d);
      setData('members', members);
    }
    triggerSafeRender();
  });

  fbListen('attend', d => {
    if(d) {
      attend = d;
      setData('attend', attend);
    }
    triggerSafeRender();
  });

  fbListen('bosses', d => {
    if(d) {
      bosses = Array.isArray(d) ? d : Object.values(d);
      setData('bosses', bosses);
    }
    triggerSafeRender();
  });
});

// 💡 첫 화면 구동 시 타이밍 병목 현상 원천 차단 시퀀스
function initialLoadSequence() {
  // 로컬에 기존 데이터가 이미 깔려있다면 먼저 레이아웃을 띄워 유저 경험 유지
  if (members.length > 0) {
    renderSidebar('dashboard');
    renderCurrentDashboard();
    isInitialDataLoaded = true;
  } else {
    // 완전 백지 상태일 경우 안내 메시지 출력 및 대기
    document.getElementById('dashContent').innerHTML = `
      <div style="text-align:center; padding:40px 0; color:var(--text2); font-size:13px;">
        🔄 서버 데이터를 동기화하는 중입니다. 잠시만 기다려주세요...
      </div>`;
  }
}

// 💡 파이어베이스 수신이 정상 확인되면 그때 사이드바와 대시보드를 완벽 매칭하여 갱신
function triggerSafeRender() {
  if (!isInitialDataLoaded) {
    isInitialDataLoaded = true;
  }
  // 새로고침 직후 데이터가 비동기로 로드되더라도 꼬이지 않고 무조건 출력 보장
  renderSidebar('dashboard');
  renderCurrentDashboard();
}

function refreshCurrentTab() {
  renderCurrentDashboard();
}

function switchTab(tab, el) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderCurrentDashboard();
}

function renderCurrentDashboard() {
  const container = document.getElementById('dashContent');
  if (!container) return;

  if (curTab === 'guild') {
    renderGuildTab(container);
  } else if (curTab === 'boss') {
    renderBossTab(container);
  } else if (curTab === 'week') {
    renderWeekTab(container);
  }
}

// 1. 길드원 현황 탭 출력
function renderGuildTab(target) {
  target.innerHTML = `
    <div class="card">
      <div class="card-head"><div class="card-title">길드원 목록 (${members.length}명)</div></div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th class="tl">닉네임</th><th>클래스</th><th>직책</th><th>가입일</th></tr>
          </thead>
          <tbody>
            ${members.length === 0 ? '<tr><td colspan="4" style="text-align:center;color:var(--text2)">등록된 길드원이 없습니다. 길드원 관리 메뉴를 이용해 주세요.</td></tr>' :
            members.map(m => `
              <tr>
                <td class="tl" style="font-weight:600">${m.nick}</td>
                <td><span class="badge b-blue">${m.class || '미지정'}</span></td>
                <td><span class="badge ${m.grade==='총관리자'?'b-red':m.grade==='부관리자'?'b-gold':'b-silver'}">${m.grade || '일반'}</span></td>
                <td style="color:var(--text2); font-size:12px;">${m.joinDate || '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

// 2. 보스 포인트 탭 출력
function renderBossTab(target) {
  target.innerHTML = `
    <div class="card">
      <div class="card-head"><div class="card-title">보스별 배정 포인트 점수</div></div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th class="tl">보스 네임</th><th>기본 포인트</th><th>야간 보너스 배율</th></tr>
          </thead>
          <tbody>
            ${bosses.map(b => `
              <tr>
                <td class="tl" style="font-weight:600; color:var(--accent);">${b.name}</td>
                <td style="font-weight:700;">${b.pts} P</td>
                <td style="color:var(--accent2)">1.2 배</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

// 3. 주간 기록 요약 탭 출력
function renderWeekTab(target) {
  const wk = getWeekKey();
  const wkData = attend[wk] || {};
  let totalRaidCount = 0;
  
  for (const bn in wkData) {
    for (const rk in wkData[bn]) totalRaidCount++;
  }

  target.innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="stat-lbl">현재 정산 주차</div><div class="stat-val" style="font-size:14px; color:var(--text);">${wk}</div></div>
      <div class="stat-box"><div class="stat-lbl">이번주 진행 레이드</div><div class="stat-val">${totalRaidCount}회</div></div>
      <div class="stat-box"><div class="stat-lbl">등록된 대상자</div><div class="stat-val">${members.length}명</div></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">진행 로그 상태 요약</div></div>
      <div style="padding:16px; font-size:13px; color:var(--text2); text-align:center;">
        이번 주차 실시간 출석 레이드 데이터가 정상 동기화 중입니다.<br>
        자세한 참여 명단 및 포인트 내역은 왼쪽 메뉴의 <strong>[보스 포인트]</strong>를 참고해 주세요.
      </div>
    </div>`;
}

// 사이드바 토글 제어
function toggleSb(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sbOv').classList.toggle('open');}
function closeSb(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sbOv').classList.remove('open');}
</script>
</body>
</html>
