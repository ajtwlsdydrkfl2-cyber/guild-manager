<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>길드 창고 — 길드 매니저</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style id="commonStyle"></style>
<style>
.grade-section{margin-bottom:20px;}
.grade-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;}
.grade-body{border:1px solid;border-top:none;border-radius:0 0 10px 10px;padding:12px;}
.grade-myth .grade-header{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);}
.grade-myth .grade-body{border-color:rgba(239,68,68,.2);}
.grade-legend .grade-header{background:rgba(234,179,8,.15);color:#eab308;border:1px solid rgba(234,179,8,.3);}
.grade-legend .grade-body{border-color:rgba(234,179,8,.2);}
.grade-hero .grade-header{background:rgba(168,85,247,.15);color:#a855f7;border:1px solid rgba(168,85,247,.3);}
.grade-hero .grade-body{border-color:rgba(168,85,247,.2);}
.grade-rare .grade-header{background:rgba(59,130,246,.15);color:#3b82f6;border:1px solid rgba(59,130,246,.3);}
.grade-rare .grade-body{border-color:rgba(59,130,246,.2);}
.grade-etc .grade-header{background:rgba(100,116,139,.1);color:#94a3b8;border:1px solid rgba(100,116,139,.2);}
.grade-etc .grade-body{border-color:rgba(100,116,139,.15);}
.item-grid{display:flex;flex-wrap:wrap;gap:8px;}
.item-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;background:var(--bg3);border:1px solid var(--border);}
.item-chip .qty{font-size:12px;font-weight:700;color:var(--accent);margin-left:2px;}
.empty-grade{color:var(--text2);font-size:13px;padding:4px 0;}
.grade-unclassified .grade-header{background:rgba(100,116,139,.15);color:#94a3b8;border:1px solid rgba(100,116,139,.3);}
.grade-unclassified .grade-body{border-color:rgba(100,116,139,.2);}
.unclass-item{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:12px;background:var(--bg3);border:1px solid var(--border);margin:3px;}
.unclass-grade-sel{font-size:11px;padding:2px 4px;border-radius:4px;background:var(--bg2);border:1px solid var(--border);color:var(--text);}
@media(max-width:768px){.item-chip{font-size:12px;padding:5px 10px;}.content{padding-bottom:100px!important;}}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="sb-ov" id="sbOv" onclick="closeSb()"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="ham" onclick="toggleSb()">☰</button>
        <div class="topbar-title">🏦 길드 창고</div>
      </div>
      <div id="adminBtns"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- 아이템 추가/수정 모달 -->
<div class="modal-ov" id="modal-item">
  <div class="modal">
    <div class="modal-title" id="itemModalTitle">📦 아이템 추가</div>
    <input type="hidden" id="item-id">
    <div class="fg">
      <label>등급</label>
      <select class="sel" id="item-grade" style="width:100%">
        <option value="myth">🔴 신화</option>
        <option value="legend">🟡 전설</option>
        <option value="hero">🟣 영웅</option>
        <option value="rare">🔵 희귀</option>
      </select>
    </div>
    <div class="fg"><label>아이템명</label><input class="inp" type="text" id="item-name" placeholder="예: 크란시아 목걸이"></div>
    <div class="fg"><label>수량</label><input class="inp" type="number" id="item-qty" value="1" min="0"></div>
    <div class="fg"><label>메모 (선택)</label><input class="inp" type="text" id="item-memo" placeholder="예: +15강"></div>
    <div class="modal-footer">
      <button class="btn btn-s" onclick="closeModal('item')">취소</button>
      <button class="btn btn-p" onclick="saveItem()">저장하기</button>
    </div>
  </div>
</div>

<!-- 스크린샷 붙여넣기 모달 -->
<div class="modal-ov" id="modal-screenshot">
  <div class="modal" style="max-width:540px">
    <div class="modal-title">📸 스크린샷 자동 분류</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.7">
      아이템 목록을 복사해서 Ctrl+V로 붙여넣으세요.<br>
      <span style="color:var(--accent)">기존에 등록된 시리즈는 자동 분류!</span><br>
      새 아이템은 미분류함에서 등급 지정 후 이동하세요.
    </div>
    <textarea class="inp" id="screenshot-text" rows="8"
      placeholder="여기에 아이템 목록을 붙여넣으세요 (Ctrl+V)&#10;예:&#10;검은 가시 반지&#10;일리아나 로브&#10;엘 세라 귀걸이"
      style="width:100%;resize:vertical;font-size:13px;line-height:1.8"
      onkeydown="event.stopPropagation()"
      oninput="previewScreenshot()"></textarea>
    <div id="screenshot-preview" style="margin-top:10px;max-height:250px;overflow-y:auto"></div>
    <div class="modal-footer">
      <button class="btn btn-s" onclick="closeModal('screenshot')">취소</button>
      <button class="btn btn-p" id="screenshot-save-btn" onclick="saveScreenshotItems()" disabled>✅ 분류 등록</button>
    </div>
  </div>
</div>

<!-- 일괄차감 모달 -->
<div class="modal-ov" id="modal-deduct">
  <div class="modal" style="max-width:520px">
    <div class="modal-title">➖ 일괄 차감</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.7">
      차감할 아이템을 입력하세요.<br>
      형식: <span style="color:var(--accent)">아이템명 수량</span> (수량 없으면 1개 차감)<br>
      쉼표 또는 줄바꿈으로 구분<br>
      <span style="color:var(--red)">수량이 0이 되면 자동 삭제됩니다</span>
    </div>
    <div class="fg">
      <label>등급</label>
      <select class="sel" id="deduct-grade" style="width:100%">
        <option value="myth">🔴 신화</option>
        <option value="legend">🟡 전설</option>
        <option value="hero">🟣 영웅</option>
        <option value="rare">🔵 희귀</option>
      </select>
    </div>
    <div class="fg">
      <label>차감할 아이템 목록</label>
      <textarea class="inp" id="deduct-text" rows="8"
        placeholder="엘 세라 귀걸이 2&#10;잿빛 여명 팔찌&#10;검은 가시 반지 3"
        style="width:100%;resize:vertical;line-height:1.8;font-size:13px"
        onkeydown="event.stopPropagation()"></textarea>
    </div>
    <div id="deduct-preview" style="font-size:12px;color:var(--text2);margin-bottom:8px"></div>
    <div class="modal-footer">
      <button class="btn btn-s" onclick="closeModal('deduct')">취소</button>
      <button class="btn btn-d" onclick="saveDeduct()">➖ 차감하기</button>
    </div>
  </div>
</div>

<!-- 일괄입력 모달 -->
<div class="modal-ov" id="modal-bulk">
  <div class="modal" style="max-width:520px">
    <div class="modal-title">📋 일괄 입력</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.7">
      한 줄에 하나씩 입력하세요.<br>
      형식: <span style="color:var(--accent)">아이템명 수량</span> (수량 없으면 1개로 등록)<br>
      같은 이름은 자동으로 합산됩니다.
    </div>
    <div class="fg">
      <label>등급</label>
      <select class="sel" id="bulk-grade" style="width:100%">
        <option value="myth">🔴 신화</option>
        <option value="legend">🟡 전설</option>
        <option value="hero">🟣 영웅</option>
        <option value="rare">🔵 희귀</option>
        </select>
    </div>
    <div class="fg">
      <label>아이템 목록</label>
      <textarea class="inp" id="bulk-text" rows="10" 
        placeholder="엘 세라 귀걸이,잿빛 여명 팔찌,검은 가시 반지&#10;또는 줄바꿈으로 입력" 
        style="width:100%;resize:vertical;line-height:1.8;font-size:13px"
        onkeydown="event.stopPropagation()"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-s" onclick="closeModal('bulk')">취소</button>
      <button class="btn btn-p" onclick="saveBulk()">일괄 등록</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
document.getElementById('commonStyle').textContent = COMMON_CSS;

const GRADES = [
  {key:'myth',   label:'신화', icon:'🔴', cls:'grade-myth'},
  {key:'legend', label:'전설', icon:'🟡', cls:'grade-legend'},
  {key:'hero',   label:'영웅', icon:'🟣', cls:'grade-hero'},
  {key:'rare',   label:'희귀', icon:'🔵', cls:'grade-rare'},
];

let warehouseItems = [];

window.addEventListener('load', () => {
  const sess = requireLogin(); if(!sess) return;
  initFirebase();
  watchServerName();
  renderSidebar('warehouse');

  if(isAdmin()) {
    document.getElementById('adminBtns').innerHTML = `
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-s btn-sm" onclick="openModal('bulk')">📋 일괄입력</button>
        <button class="btn btn-s btn-sm" onclick="openModal('screenshot')">📸 스크린샷</button>
        <button class="btn btn-d btn-sm" onclick="openModal('deduct')">➖ 일괄차감</button>
        <button class="btn btn-p btn-sm" onclick="openAddItem()">+ 추가</button>
        <button class="btn btn-d btn-sm" onclick="clearAll()">🗑️ 전체삭제</button>
      </div>`;
  }

  fbListen('warehouseItems', data => {
    warehouseItems = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
    setData('warehouseItems', warehouseItems);
    renderWarehouse();
  });

  warehouseItems = getData('warehouseItems', []);
  loadSeriesMap();
  renderWarehouse();
});

// 아이템 자동 분류
const CATS = [
  {key:'weapon', icon:'⚔️', label:'무기',
   keywords:['석궁','활','전투봉','마법봉','사이드','단검','대검','전투방패','검/방패','권갑','지팡이']},
  {key:'armor',  icon:'🛡️', label:'방어구',
   keywords:['그리브','건틀렛','두건','로브','투구','갑옷','바지','장갑','부츠','각반','조끼','아대','가죽','장화']},
  {key:'cloak',  icon:'🧣', label:'망토',
   keywords:['망토']},
  {key:'acc',    icon:'💍', label:'장신구',
   keywords:['팔찌','목걸이','반지','귀걸이','허리띠']},
  {key:'etc',    icon:'📦', label:'기타', keywords:[]},
];

function getCategory(name) {
  for(const cat of CATS) {
    if(cat.key==='etc') continue;
    if(cat.keywords.some(k=>name.includes(k))) return cat.key;
  }
  return 'etc';
}

function renderWarehouse() {
  const admin = isAdmin();
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';

  GRADES.forEach(g => {
    const gradeItems = warehouseItems
      .filter(i=>(i.grade||'myth')===g.key)
      .sort((a,b)=>a.name.localeCompare(b.name,'ko'));

    const totalQty = gradeItems.reduce((s,i)=>s+i.qty,0);

    // 소분류별 그룹핑
    const catGroups = {};
    CATS.forEach(c=>catGroups[c.key]=[]);
    gradeItems.forEach(item=>{
      const cat = getCategory(item.name);
      catGroups[cat].push(item);
    });

    const catHtml = CATS.map(cat=>{
      const items = catGroups[cat.key];
      if(items.length===0) return '';
      return `<div style="margin-bottom:10px">
        <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,.08)">
          ${cat.icon} ${cat.label} <span style="font-weight:400">(${items.length}종)</span>
        </div>
        <div class="item-grid">
          ${items.map(item=>`
            <div class="item-chip">
              <span>${item.name}${item.memo?` <span style="font-size:11px;color:var(--text2)">(${item.memo})</span>`:''}</span>
              ${item.qty>1?`<span class="qty">×${item.qty}</span>`:''}
              ${admin?`<button onclick="openEditItem(${item.id})" style="background:none;border:none;cursor:pointer;color:var(--text2);font-size:12px;padding:0 2px">✏️</button>
              <button onclick="delItem(${item.id})" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:12px;padding:0 2px">✕</button>`:''}
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');

    html += `<div class="grade-section ${g.cls}">
      <div class="grade-header">
        ${g.icon} ${g.label}
        <span style="font-size:12px;font-weight:400;opacity:.7">${gradeItems.length}종 / ${totalQty}개</span>
      </div>
      <div class="grade-body" style="min-height:80px">
        ${gradeItems.length===0
          ?`<div style="color:var(--text2);font-size:13px;text-align:center;padding:20px 0">비어있음</div>`
          :catHtml}
      </div>
    </div>`;
  });

  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function openAddItem() {
  document.getElementById('itemModalTitle').textContent = '📦 아이템 추가';
  document.getElementById('item-id').value = '';
  document.getElementById('item-name').value = '';
  document.getElementById('item-qty').value = '1';
  document.getElementById('item-memo').value = '';
  document.getElementById('item-grade').value = 'legend';
  openModal('item');
}

function openEditItem(id) {
  const item = warehouseItems.find(x=>x.id===id); if(!item) return;
  document.getElementById('itemModalTitle').textContent = '✏️ 아이템 수정';
  document.getElementById('item-id').value = id;
  document.getElementById('item-name').value = item.name;
  document.getElementById('item-qty').value = item.qty;
  document.getElementById('item-memo').value = item.memo||'';
  document.getElementById('item-grade').value = item.grade||'legend';
  openModal('item');
}

function saveItem() {
  const id = document.getElementById('item-id').value;
  const name = document.getElementById('item-name').value.trim();
  if(!name) { showToast('아이템명을 입력해주세요','error'); return; }
  const qty = parseInt(document.getElementById('item-qty').value)||1;
  const grade = document.getElementById('item-grade').value;
  const memo = document.getElementById('item-memo').value.trim();

  if(id) {
    const item = warehouseItems.find(x=>x.id===parseInt(id)); if(!item) return;
    Object.assign(item, {name, qty, grade, memo});
  } else {
    // 같은 이름+등급 있으면 합산
    const existing = warehouseItems.find(x=>x.name===name&&x.grade===grade);
    if(existing) { existing.qty+=qty; }
    else {
      const newId = Math.max(0,...warehouseItems.map(x=>x.id),0)+1;
      warehouseItems.push({id:newId, name, qty, grade, memo});
    }
  }
  saveWarehouse();
  closeModal('item');
  showToast('저장됨!','success');
}

function delItem(id) {
  const item = warehouseItems.find(x=>x.id===id);
  if(!confirm(`"${item?.name}" 삭제?`)) return;
  warehouseItems = warehouseItems.filter(x=>x.id!==id);
  saveWarehouse();
  showToast('삭제됨');
}

function clearAll() {
  if(!confirm('창고 전체 삭제?')) return;
  warehouseItems = [];
  saveWarehouse();
  showToast('전체 삭제됨');
}

function saveBulk() {
  const text = document.getElementById('bulk-text').value.trim();
  const grade = document.getElementById('bulk-grade').value;
  if(!text) return;

  const lines = text.split(/[,\n]/).map(l=>l.trim()).filter(l=>l);
  let added = 0;
  lines.forEach(line => {
    line = line.trim(); if(!line) return;
    const match = line.match(/^(.+?)\s+(\d+)$/);
    let name, qty;
    if(match) { name=match[1].trim(); qty=parseInt(match[2]); }
    else { name=line; qty=1; }
    if(!name) return;
    const existing = warehouseItems.find(x=>x.name===name&&x.grade===grade);
    if(existing) { existing.qty+=qty; }
    else {
      const newId = Math.max(0,...warehouseItems.map(x=>x.id),0)+1;
      warehouseItems.push({id:newId, name, qty, grade, memo:''});
    }
    added++;
  });

  saveWarehouse();
  closeModal('bulk');
  showToast(`${added}개 아이템 등록됨!`,'success');
}

// ===== 스크린샷 자동 분류 =====
// 시리즈 학습 데이터 (Firebase에 저장)
let seriesMap = {}; // {시리즈명: 등급}
let previewItems = []; // {name, grade, isNew}

function loadSeriesMap() {
  const saved = getData('seriesMap', {});
  seriesMap = saved;
  fbListen('seriesMap', d => { if(d) { seriesMap = d; setData('seriesMap', d); } });
}

function getSeriesKey(name) {
  // 앞 1~2단어를 시리즈 키로 사용
  const words = name.trim().split(' ');
  if(words.length >= 2) return words.slice(0,2).join(' ');
  return words[0];
}

function findGradeByName(name) {
  // 1. 완전 일치 아이템이 창고에 있으면 그 등급
  const exact = warehouseItems.find(x => x.name === name);
  if(exact) return exact.grade;
  // 2. 시리즈맵에서 찾기
  const series = getSeriesKey(name);
  if(seriesMap[series]) return seriesMap[series];
  // 3. 시리즈맵 앞단어만으로도 확인
  const firstWord = name.split(' ')[0];
  const match = Object.keys(seriesMap).find(k => k.startsWith(firstWord));
  if(match) return seriesMap[match];
  return null;
}

function previewScreenshot() {
  const text = document.getElementById('screenshot-text').value.trim();
  if(!text) {
    document.getElementById('screenshot-preview').innerHTML = '';
    document.getElementById('screenshot-save-btn').disabled = true;
    return;
  }
  const lines = text.split(/[\n,]/).map(l => l.trim()).filter(l => l.length > 1);
  previewItems = [];
  const GRADE_LABELS = {myth:'🔴 신화', legend:'🟡 전설', hero:'🟣 영웅', rare:'🔵 희귀'};

  lines.forEach(line => {
    if(/^\d+$/.test(line)) return;
    const name = line.replace(/[^\w가-힣\s\/]/g, '').trim();
    if(name.length < 2) return;
    const grade = findGradeByName(name);
    previewItems.push({name, grade, series: getSeriesKey(name)});
  });

  if(previewItems.length === 0) {
    document.getElementById('screenshot-preview').innerHTML = '<div style="color:var(--text2);font-size:12px">인식된 아이템 없음</div>';
    document.getElementById('screenshot-save-btn').disabled = true;
    return;
  }

  const known = previewItems.filter(x => x.grade);
  const unknown = previewItems.filter(x => !x.grade);

  let html = '';
  if(known.length > 0) {
    html += `<div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:6px">✅ 자동 분류 (${known.length}개)</div>`;
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">';
    known.forEach(item => {
      html += `<span style="font-size:11px;padding:3px 8px;border-radius:6px;background:var(--bg3);border:1px solid var(--border)">${GRADE_LABELS[item.grade]} ${item.name}</span>`;
    });
    html += '</div>';
  }
  if(unknown.length > 0) {
    html += `<div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px">❓ 미분류 - 등급 선택 (${unknown.length}개)</div>`;
    unknown.forEach((item, i) => {
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;background:var(--bg3);padding:6px 10px;border-radius:8px">
        <span style="font-size:12px;flex:1">${item.name}</span>
        <select class="sel" id="unclass_${i}" onchange="updatePreviewGrade(${i}, this.value)" style="font-size:11px;padding:3px 6px">
          <option value="">등급선택</option>
          <option value="myth">🔴 신화</option>
          <option value="legend">🟡 전설</option>
          <option value="hero">🟣 영웅</option>
          <option value="rare">🔵 희귀</option>
        </select>
      </div>`;
    });
  }

  document.getElementById('screenshot-preview').innerHTML = html;
  document.getElementById('screenshot-save-btn').disabled = false;
}

function updatePreviewGrade(unknownIdx, grade) {
  const unknowns = previewItems.filter(x => !x.grade || x._manualGrade);
  // 실제 previewItems에서 해당 인덱스 찾아서 업데이트
  let cnt = 0;
  previewItems.forEach(item => {
    if(!item.grade || item._manualGrade) {
      if(cnt === unknownIdx) { item._manualGrade = grade; }
      cnt++;
    }
  });
}

function saveScreenshotItems() {
  if(previewItems.length === 0) return;
  let added = 0;
  const newSeriesMap = {...seriesMap};

  previewItems.forEach(item => {
    const finalGrade = item.grade || item._manualGrade;
    if(!finalGrade) return; // 등급 미선택 스킵

    // 창고에 추가
    const existing = warehouseItems.find(x => x.name === item.name && x.grade === finalGrade);
    if(existing) { existing.qty++; }
    else {
      warehouseItems.push({id: Date.now() + Math.random(), name: item.name, grade: finalGrade, qty: 1, memo: ''});
    }
    added++;

    // 시리즈맵 학습 (새 아이템이면)
    if(!item.grade && item._manualGrade) {
      newSeriesMap[item.series] = item._manualGrade;
    }
  });

  // 시리즈맵 저장
  if(JSON.stringify(newSeriesMap) !== JSON.stringify(seriesMap)) {
    seriesMap = newSeriesMap;
    setData('seriesMap', seriesMap);
    fbSet('seriesMap', seriesMap);
  }

  saveWarehouse();
  closeModal('screenshot');
  document.getElementById('screenshot-text').value = '';
  document.getElementById('screenshot-preview').innerHTML = '';
  previewItems = [];
  showToast(`${added}개 아이템 분류 완료!`, 'success');
}

function saveDeduct() {
  const text = document.getElementById('deduct-text').value.trim();
  const grade = document.getElementById('deduct-grade').value;
  if(!text) return;

  const lines = text.split(/[,\n]/).map(l=>l.trim()).filter(l=>l);
  let deducted = 0, notFound = [];

  lines.forEach(line => {
    const match = line.match(/^(.+?)\s+(\d+)$/);
    let name, qty;
    if(match) { name=match[1].trim(); qty=parseInt(match[2]); }
    else { name=line; qty=1; }
    if(!name) return;

    // 같은 이름+등급 찾기
    const item = warehouseItems.find(x=>x.name===name&&x.grade===grade);
    if(item) {
      item.qty = Math.max(0, item.qty - qty);
      if(item.qty <= 0) {
        warehouseItems = warehouseItems.filter(x=>x.id!==item.id);
        showToast(`${name} 삭제됨`);
      }
      deducted++;
    } else {
      notFound.push(name);
    }
  });

  saveWarehouse();
  closeModal('deduct');
  document.getElementById('deduct-text').value = '';

  if(notFound.length > 0) {
    showToast(`${deducted}개 차감 완료. 미발견: ${notFound.join(', ')}`, 'error');
  } else {
    showToast(`${deducted}개 아이템 차감 완료!`, 'success');
  }
}

function saveWarehouse() {
  setData('warehouseItems', warehouseItems);
  fbSet('warehouseItems', warehouseItems);
  renderWarehouse();
}

function openModal(n){document.getElementById('modal-'+n).classList.add('open');}
function closeModal(n){document.getElementById('modal-'+n).classList.remove('open');}
document.querySelectorAll('.modal-ov').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');}));
function toggleSb(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sbOv').classList.toggle('open');}
function closeSb(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sbOv').classList.remove('open');}
</script>
